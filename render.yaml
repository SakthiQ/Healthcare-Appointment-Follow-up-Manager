# Render Blueprint for the backend API (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint > pick this repo. Render reads this file, creates the
# service, and prompts for every `sync: false` value (never committed here).
# The database is external (e.g. Neon) — paste its connection string as DATABASE_URL.
# Full walkthrough: docs/deployment.md
services:
  - type: web
    name: healthcare-api
    runtime: python
    plan: free
    rootDir: backend
    # constraints.txt pins every package to the version CI tests, so a deploy next month
    # installs what a deploy today does. Refresh with backend/scripts/refresh_constraints.py.
    buildCommand: pip install -r requirements.txt -c constraints.txt
    # Migrations run on every boot; they are idempotent, and a fresh database gets
    # every table, index and constraint on the first deploy.
    # No --proxy-headers / --forwarded-allow-ips: with those, uvicorn takes the LEFTMOST
    # X-Forwarded-For entry, which the client writes, so anyone could dodge the login
    # lockout and per-IP limits by sending a new fake IP each time. The app reads the
    # client IP itself (CLIENT_IP_HEADER / TRUSTED_PROXY_HOPS below).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      # Mock AI/email/calendar providers: the whole app works with no external
      # credentials. See docs/deployment.md sections 4-6 before setting False.
      - key: DEMO_MODE
        value: "True"
      - key: DATABASE_URL
        sync: false
      # Render generates a strong random JWT signing key once and keeps it.
      - key: SECRET_KEY
        generateValue: true
      # The Vercel production URL, e.g. https://your-app.vercel.app (no trailing slash).
      # Password-reset and email-verification links point here. Without it they would
      # point at http://localhost:5173.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optional: also allow Vercel preview deployments, e.g.
      # ^https://your-project-[a-z0-9-]+\.vercel\.app$
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false
      # This service type has no separate worker process, so the notification and
      # calendar workers run on background threads inside the web process.
      # Without this, queued emails and calendar syncs are never delivered.
      - key: RUN_WORKERS_IN_PROCESS
        value: "True"
      - key: ALLOW_PRIVILEGED_SELF_REGISTRATION
        value: "False"
      # Requests reach Render services through Cloudflare, then Render's proxy. Cloudflare
      # puts the client IP in CF-Connecting-IP (overwriting any value the client sent);
      # if that header is ever missing, the entry 2 from the right of X-Forwarded-For is
      # the address Cloudflare saw. Check after deploying: sign in, then open the admin
      # Audit log; the auth.login entry must show your own public IP. See
      # docs/deployment.md "Client IP behind proxies".
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # Capacity per process (docs/deployment.md "Capacity and scaling"). Requests beyond
      # MAX_CONCURRENT_REQUESTS wait briefly for a place, then get 503 instead of stalling.
      # The free plan (0.1 CPU) serves a demo, not real traffic: for that, move to a paid
      # plan, add instances, and use Neon's POOLED connection string for DATABASE_URL.
      - key: MAX_CONCURRENT_REQUESTS
        value: "12"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
