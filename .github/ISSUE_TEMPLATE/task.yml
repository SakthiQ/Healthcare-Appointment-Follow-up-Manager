name: Task (maintainer)
description: A piece of work for a contributor to pick up. Opened by the maintainer.
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        **Contributors:** comment below to ask for this task and wait to be assigned before starting.
        See CONTRIBUTING.md for how assignment works.
  - type: textarea
    id: summary
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria the pull request must meet.
      placeholder: |
        - [ ] ...
        - [ ] Tests cover the new behaviour
    validations:
      required: true
  - type: textarea
    id: pointers
    attributes:
      label: Where to start
      description: Files, functions or docs that are relevant.
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Beginner (good first issue)
        - Intermediate
        - Advanced
    validations:
      required: true
  - type: input
    id: skills
    attributes:
      label: Skills needed
      placeholder: e.g. Python, FastAPI, React, TypeScript, SQL
