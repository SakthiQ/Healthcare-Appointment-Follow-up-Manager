name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches PYTHON_VERSION in render.yaml (the production runtime).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install the pinned dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Every installed package is pinned (and matches its pin)
        run: python scripts/check_constraints.py

      - name: No broken requirements
        run: pip check

      - name: Run the tests
        run: python -m pytest -q

      - name: Migrations apply to an empty SQLite database
        run: DATABASE_URL=sqlite:///./ci_migration_check.db alembic upgrade head

  postgres:
    name: PostgreSQL guarantees
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The official image includes the contrib extensions, so btree_gist is available and
      # the full per-doctor overlap constraint is exercised, not just a variant.
      postgres:
        image: postgres:16
        env:
          # No password: this container exists only for the duration of the job and is
          # reachable only from its runner, so there is no credential to protect or leak.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - run: pip install -r requirements.txt -c constraints.txt

      # SQLite has no row locks, exclusion constraints or real concurrency. This proves the
      # PostgreSQL-only guarantees: every migration applies, the database rejects overlapping
      # appointments, concurrent bookings and holds resolve to one winner, and a leave cannot
      # interleave with a booking. It wipes the scratch database, which only exists in this job.
      - name: Verify the PostgreSQL-only guarantees
        env:
          VERIFY_PG_URL: postgresql://postgres@localhost:5432/scratch
          VERIFY_PG_WIPE: "yes"
        run: python scripts/verify_postgres.py

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says, and fails if it disagrees
      # with package.json.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
